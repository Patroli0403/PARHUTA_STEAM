<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><title>Parhuta Steam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--pri:#0A192F;--acc:#1E90FF;--bg:#121212;--card:#0d1f3a;--tx:#E0E0E0;--mut:#8a9bb5;--bd:#1f3558;--ok:#2ecc71;--bad:#ff5c5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5fb;--card:#fff;--tx:#14213a;--mut:#5b6b85;--bd:#d5deee;--pri:#0A192F}}
:root[data-theme="dark"]{--bg:#121212;--card:#0d1f3a;--tx:#E0E0E0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,Roboto,Poppins,system-ui,sans-serif}
nav{background:var(--pri);color:#E0E0E0;display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:2px solid var(--acc)}
nav b{font-size:18px;margin-right:auto}nav b span{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--acc);color:#fff;font-weight:600}
button.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}button.d{background:var(--bad)}button.s{padding:4px 9px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:18px}h3{margin:0 0 10px;font-size:16px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.bar>div{flex:1;min-width:140px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}.tabs button{background:var(--card);border:1px solid var(--bd);color:var(--tx);white-space:nowrap}.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--acc);border-radius:10px;padding:14px}.stat small{color:var(--mut)}.stat div{font-size:22px;font-weight:700}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--acc);font-size:12px;text-transform:uppercase}td.n,th.n{text-align:right}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 6px 3px 12px;margin:0 6px 6px 0}.chip button{padding:0 7px;background:var(--bad);border-radius:50%}
.pos{color:var(--ok)}.neg{color:var(--bad)}.err{color:var(--bad);margin-top:8px}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}#ov.on{display:flex}
.box{background:var(--card);border-radius:12px;padding:16px;max-height:90%;overflow:auto}
#rc{background:#fff;color:#000;width:280px;padding:14px;font:12px/1.5 'Courier New',monospace;margin:0 auto 12px}#rc hr{border:0;border-top:1px dashed #000}#rc .l{display:flex;justify-content:space-between;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 18px;border-radius:8px;font-weight:600;display:none;z-index:20}
body{font-family:'Plus Jakarta Sans',Inter,system-ui,sans-serif}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{letter-spacing:-.02em}h2{font-size:20px;font-weight:700}
nav{border-bottom:1px solid var(--bd);gap:4px}nav b{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.logo{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font-size:18px}
nav button{background:#1e90ff33;color:#fff;padding:7px 14px}nav button.g{background:transparent;border-color:transparent;color:#b6c4dc}
button{border-radius:10px;transition:filter .15s,transform .1s}button:hover{filter:brightness(1.12)}button:active{transform:scale(.98)}
.card{border-radius:14px}input,select{border-radius:10px;padding:11px 12px}input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #1e90ff33}
#amt{font-size:22px;font-weight:700}.bar button{padding:12px 20px}
.hero{position:relative;overflow:hidden;background:var(--pri);color:#E0E0E0;border:1px solid var(--bd);border-radius:16px;padding:24px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;min-height:120px}
.hero>*{position:relative;z-index:1}.hero h1{margin:0;font-size:28px;font-weight:800;color:#fff}.hero p{margin:4px 0 0;color:#9fb3d1}
.hero i{position:absolute;z-index:0;bottom:-30px;width:90px;height:90px;border-radius:50%;background:#cfe6ff;filter:blur(28px);opacity:0;animation:steam 5s ease-out both}
.hero i:nth-child(1){left:52%}.hero i:nth-child(2){left:68%;animation-delay:.6s}.hero i:nth-child(3){left:84%;animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.6)}30%{opacity:.35}100%{opacity:0;transform:translateY(-130px) scale(1.7)}}
.kpi{display:flex;gap:20px;flex-wrap:wrap}.kpi div{border-left:2px solid var(--acc);padding:2px 14px}.kpi small{display:block;color:#9fb3d1;font-size:12px}.kpi b{font-size:20px;color:#fff}
.vp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:4px 0 18px}
.vc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;background:var(--bg);border:2px solid var(--bd);color:var(--tx);text-align:left;border-radius:14px}
.vc span{font-size:38px;line-height:1.2}.vc b{font-weight:700}.vc small{color:var(--mut);font-size:14px;font-weight:600}
.vc:hover{border-color:#1e90ff88;filter:none}.vc.on{border-color:var(--acc);background:#1e90ff1f}.vc.on small{color:var(--acc)}
.tabs{gap:2px;border-bottom:1px solid var(--bd)}.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--mut);padding:10px 14px}
.tabs button.on{background:transparent;color:var(--tx);border-bottom-color:var(--acc)}.tabs button.g{margin-left:auto;color:var(--bad)}
.stat{border-left:1px solid var(--bd);border-radius:12px}
.stat:nth-child(5){grid-column:1/-1;order:-1;background:var(--pri);border-color:var(--acc);padding:22px;color:#E0E0E0}.stat:nth-child(5) small{color:#9fb3d1}.stat:nth-child(5) div{font-size:36px}
th{text-transform:none;font-size:13px;color:var(--mut);font-weight:600}.tw{border:1px solid var(--bd);border-radius:10px}tr:hover td{background:#1e90ff12}tr:last-child td{border-bottom:0}
.login{max-width:400px;margin:48px auto}.login .logo{width:48px;height:48px;font-size:24px;margin-bottom:12px}.login button{width:100%}
@media(max-width:560px){.hero h1{font-size:23px}main{padding:12px}nav button{padding:6px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none;display:block;padding:0}.box{background:none;padding:0}.noprint{display:none}#rc{width:100%}}
</style></head><body>
<nav><b><i class="logo">🚿</i><span>Parhuta Steam</span></b><button class="g" id="n1" onclick="go('kasir')">Kasir</button><button class="g" id="n2" onclick="go('admin')">Admin</button></nav>
<main id="app"></main>
<div id="ov"><div class="box" id="bx"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{const v=localStorage.getItem('ps_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem('ps_'+k,JSON.stringify(v))}catch(e){}};
const DS={biz:'Parhuta Steam',addr:'(isi alamat & nomor telepon)',footer:'Terima kasih, hati-hati di jalan!',
price:{'Motor Kecil':{rate:15000,com:.4},'Motor Besar':{rate:20000,com:.4},'Mobil Kecil':{rate:35000,com:.4},'Mobil Besar':{rate:45000,com:.4}},
ops:['Operator 1','Operator 2'],pay:['Cash','QRIS','Transfer'],cats:['Sabun & Shampoo','Chemical / Wax','Listrik & Air','Lainnya']};
let S=ld('s',DS),T=ld('t',[]),E=ld('e',[]),page='kasir',admin=false,tab='dash';
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const now=new Date(),F={from:ymd(new Date(now.getFullYear(),now.getMonth(),1)),to:ymd(now)};
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID'),V=Object.keys(S.price);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inR=d=>d>=F.from&&d<=F.to,tR=()=>T.filter(t=>inR(t.d)),eR=()=>E.filter(e=>inR(e.d));
const com=t=>t.amt*((S.price[t.v]||{}).com||0);
const fmt=ts=>new Date(ts).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function go(p){page=p;render()}
function opts(a,sel){return a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('')}

function render(){
 $('#n1').className=page=='kasir'?'':'g';$('#n2').className=page=='admin'?'':'g';
 $('#app').innerHTML=page=='kasir'?kasir():!admin?login():adminView();
}
/* ---------- KASIR ---------- */
function kasir(){const v=V[0],tt=T.filter(t=>t.d==ymd(new Date()));return `<div class="hero"><i></i><i></i><i></i><div><h1>Kasir</h1><p>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div><div class="kpi"><div><small>Kendaraan hari ini</small><b>${tt.length}</b></div><div><small>Pemasukan hari ini</small><b>${rp(tt.reduce((a,x)=>a+x.amt,0))}</b></div></div></div><div class="card"><h2>Input Transaksi</h2>
<label>Jenis kendaraan</label><input type="hidden" id="v" value="${V[0]}"><div class="vp">${V.map((x,i)=>`<button type="button" class="vc${i?'':' on'}" data-v="${x}" onclick="pick('${x}')"><span>${ICO[x]||'🚗'}</span><b>${x}</b><small>${rp(S.price[x].rate)}</small></button>`).join('')}</div><div class="row"><div><label>Nomor Struk (otomatis)</label><input id="no" value="${nextNo()}" readonly></div>

<div><label>Plat Nomor (opsional)</label><input id="plat" placeholder="BB 1234 XY"></div></div>
<div class="row"><div><label>Nama Operator</label><select id="op">${opts(S.ops)}</select></div>
<div><label>Jenis Pembayaran</label><select id="pay">${opts(S.pay)}</select></div>
<div><label>Total Pembelian (Rp)</label><input id="amt" type="number" min="0" value="${S.price[v].rate}"></div></div>
<div class="row"><div><label>Catatan (opsional)</label><input id="note"></div></div>
<div class="bar"><button onclick="saveTx(true)">Simpan &amp; Cetak</button><button class="g" onclick="saveTx(false)">Simpan</button></div><div class="err" id="er"></div></div>
<div class="card"><h3>Transaksi Hari Ini</h3><div class="tw"><table><tr><th>No. Struk</th><th>Jam</th><th>Kendaraan</th><th>Operator</th><th class="n">Total</th></tr>
${T.filter(t=>t.d==ymd(new Date())).slice(0,8).map(t=>`<tr><td>${t.no}</td><td>${new Date(t.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</td><td>${esc(t.v)}</td><td>${esc(t.op)}</td><td class="n">${rp(t.amt)}</td></tr>`).join('')||'<tr><td colspan=5>Belum ada transaksi</td></tr>'}</table></div></div>`}
const ICO={'Motor Kecil':'🛵','Motor Besar':'🏍️','Mobil Kecil':'🚗','Mobil Besar':'🚙'};
function pick(v){$('#v').value=v;$('#amt').value=S.price[v].rate;document.querySelectorAll('.vc').forEach(b=>b.classList.toggle('on',b.dataset.v==v))}
function nextNo(){const d=ymd(new Date());return 'PS-'+d.replace(/-/g,'')+'-'+String(T.filter(t=>t.d==d).length+1).padStart(4,'0')}
function saveTx(pr){
 const amt=+$('#amt').value,op=$('#op').value;
 if(!op){$('#er').textContent='Tambahkan operator di Pengaturan admin terlebih dahulu.';return}
 if(!(amt>0)){$('#er').textContent='Total pembelian harus lebih dari 0.';return}
 const n=new Date(),t={id:Date.now(),no:$('#no').value,ts:n.toISOString(),d:ymd(n),v:$('#v').value,plat:$('#plat').value.trim().toUpperCase(),op,pay:$('#pay').value,amt,note:$('#note').value.trim()};
 T.unshift(t);sv('t',T);render();toast('Transaksi tersimpan');if(pr)receipt(t)}
function receipt(t){
 $('#bx').innerHTML=`<div id="rc"><div style="text-align:center"><b style="font-size:14px">${esc(S.biz)}</b><br>${esc(S.addr)}</div><hr>
 <div class="l"><span>No</span><span>${t.no}</span></div><div class="l"><span>Tgl</span><span>${fmt(t.ts)}</span></div>
 <div class="l"><span>Kendaraan</span><span>${esc(t.v)}</span></div>${t.plat?`<div class="l"><span>Plat</span><span>${esc(t.plat)}</span></div>`:''}
 <div class="l"><span>Operator</span><span>${esc(t.op)}</span></div><div class="l"><span>Bayar</span><span>${esc(t.pay)}</span></div><hr>
 <div class="l"><b>TOTAL</b><b>${rp(t.amt)}</b></div><hr><div style="text-align:center">${esc(S.footer)}</div></div>
 <div class="bar noprint" style="justify-content:center"><button onclick="window.print()">Cetak</button><button class="g" onclick="$('#ov').classList.remove('on')">Tutup</button></div>`;
 $('#ov').classList.add('on')}
/* ---------- LOGIN ---------- */
function login(){return `<div class="card login"><i class="logo">🔐</i><h2>Masuk ke panel admin</h2>
<label>Username</label><input id="u" autocomplete="username"><div style="height:10px"></div><label>Password</label><input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()">
<div class="err" id="er"></div><div style="height:12px"></div><button onclick="doLogin()">Masuk</button></div>`}
function doLogin(){if($('#u').value==='Parhuta'&&$('#p').value==='Pahuta123'){admin=true;tab='dash';render()}else $('#er').textContent='Username atau password salah.'}
/* ---------- ADMIN ---------- */
const TABS={dash:'Dasbor',buku:'Pembukuan',komisi:'Komisi',rekap:'Rekap Harian',set:'Pengaturan'};
function adminView(){
 const flt=tab!='set'?`<div class="card"><div class="bar"><div><label>Tanggal Mulai</label><input type="date" value="${F.from}" onchange="F.from=this.value;render()"></div><div><label>Tanggal Akhir</label><input type="date" value="${F.to}" onchange="F.to=this.value;render()"></div></div></div>`:'';
 return `<div class="hero"><i></i><i></i><i></i><div><h1>${TABS[tab]}</h1><p>Panel admin Parhuta Steam</p></div></div><div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}<button class="g" onclick="admin=false;render()">Keluar</button></div>${flt}${{dash,buku,komisi,rekap,set}[tab]()}`}
function totals(){const t=tR(),inc=t.reduce((a,x)=>a+x.amt,0),ex=eR().reduce((a,x)=>a+x.amt,0),cm=t.reduce((a,x)=>a+com(x),0);return{n:t.length,inc,ex,cm,net:inc-ex-cm}}
function dash(){const x=totals();return `<div class="stats">${[['Jumlah Kendaraan',x.n],['Total Pemasukan',rp(x.inc)],['Total Pengeluaran',rp(x.ex)],['Komisi Operator',rp(x.cm)],['Laba Bersih',rp(x.net)]].map(([a,b])=>`<div class="stat"><small>${a}</small><div class="${a=='Laba Bersih'?(x.net>=0?'pos':'neg'):''}">${b}</div></div>`).join('')}</div>`}
function buku(){return `<div class="card"><div class="bar" style="justify-content:space-between"><h2 style="margin:0">Pemasukan</h2><button onclick="xl()">Download Excel</button></div><div class="tw"><table><tr><th>No. Struk</th><th>Tanggal</th><th>Kategori</th><th>Operator</th><th>Jenis Transaksi</th><th class="n">Jumlah</th><th></th></tr>
${tR().map(t=>`<tr><td>${t.no}</td><td>${fmt(t.ts)}</td><td>${esc(t.v)}</td><td>${esc(t.op)}</td><td>${esc(t.pay)}</td><td class="n">${rp(t.amt)}</td><td><button class="s d" onclick="delT(${t.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=7>Tidak ada data</td></tr>'}</table></div></div>
<div class="card"><h2>Pengeluaran</h2><div class="row"><div><label>Tanggal</label><input id="xd" type="date" value="${ymd(new Date())}"></div><div><label>Keterangan</label><input id="xk"></div><div><label>Kategori</label><select id="xc">${opts(S.cats)}</select></div><div><label>Jumlah (Rp)</label><input id="xj" type="number" min="0"></div></div>
<button onclick="addE()">Tambah Pengeluaran</button><div class="err" id="er"></div><div class="tw" style="margin-top:12px"><table><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th class="n">Jumlah</th><th></th></tr>
${eR().map(e=>`<tr><td>${e.d}</td><td>${esc(e.k)}</td><td>${esc(e.c)}</td><td class="n">${rp(e.amt)}</td><td><button class="s d" onclick="delE(${e.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan=5>Tidak ada data</td></tr>'}</table></div></div>`}
function addE(){const a=+$('#xj').value,k=$('#xk').value.trim();if(!k||!(a>0)||!$('#xd').value){$('#er').textContent='Lengkapi tanggal, keterangan, dan jumlah.';return}
 E.unshift({id:Date.now(),d:$('#xd').value,k,c:$('#xc').value,amt:a});sv('e',E);render();toast('Pengeluaran ditambahkan')}
function delT(i){if(confirm('Hapus transaksi ini?')){T=T.filter(t=>t.id!==i);sv('t',T);render()}}
function delE(i){if(confirm('Hapus pengeluaran ini?')){E=E.filter(t=>t.id!==i);sv('e',E);render()}}
function xl(){try{const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tR().map(t=>({'No. Struk':t.no,Tanggal:t.d,Kategori:t.v,'Plat Nomor':t.plat,Operator:t.op,'Jenis Transaksi':t.pay,Jumlah:t.amt,Catatan:t.note}))),'Pemasukan');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(eR().map(e=>({Tanggal:e.d,Keterangan:e.k,Kategori:e.c,Jumlah:e.amt}))),'Pengeluaran');
 XLSX.writeFile(wb,`Parhuta-Steam_${F.from}_${F.to}.xlsx`)}catch(e){alert('Ekspor Excel gagal: '+e.message)}}
function komisi(){const m={};tR().forEach(t=>{const o=m[t.op]||(m[t.op]={c:{},n:0,r:0,k:0});o.c[t.v]=(o.c[t.v]||0)+1;o.n++;o.r+=t.amt;o.k+=com(t)});
 return `<div class="card"><h2>Laporan Komisi Operator</h2><div class="tw"><table><tr><th>Operator</th>${V.map(v=>`<th class="n">${v}</th>`).join('')}<th class="n">Total Kendaraan</th><th class="n">Total Pendapatan</th><th class="n">Komisi</th></tr>
 ${Object.entries(m).map(([k,o])=>`<tr><td>${esc(k)}</td>${V.map(v=>`<td class="n">${o.c[v]||0}</td>`).join('')}<td class="n">${o.n}</td><td class="n">${rp(o.r)}</td><td class="n">${rp(o.k)}</td></tr>`).join('')||`<tr><td colspan=${V.length+4}>Tidak ada data</td></tr>`}</table></div></div>`}
function rekap(){const days=[...new Set([...tR().map(t=>t.d),...eR().map(e=>e.d)])].sort();let cum=0;
 return `<div class="card"><h2>Rekap Harian</h2><div class="tw"><table><tr><th>Tanggal</th><th class="n">Kendaraan</th>${S.pay.map(p=>`<th class="n">${esc(p)}</th>`).join('')}<th class="n">Pemasukan</th><th class="n">Pengeluaran</th><th class="n">Selisih</th><th class="n">Saldo Kumulatif</th></tr>
 ${days.map(d=>{const t=T.filter(x=>x.d==d),inc=t.reduce((a,x)=>a+x.amt,0),ex=E.filter(x=>x.d==d).reduce((a,x)=>a+x.amt,0),df=inc-ex;cum+=df;
 return `<tr><td>${d}</td><td class="n">${t.length}</td>${S.pay.map(p=>`<td class="n">${rp(t.filter(x=>x.pay==p).reduce((a,x)=>a+x.amt,0))}</td>`).join('')}<td class="n">${rp(inc)}</td><td class="n">${rp(ex)}</td><td class="n ${df>=0?'pos':'neg'}">${rp(df)}</td><td class="n">${rp(cum)}</td></tr>`}).join('')||`<tr><td colspan=${S.pay.length+6}>Tidak ada data</td></tr>`}</table></div></div>`}
/* ---------- PENGATURAN ---------- */
function list(k,title){return `<div class="card"><h3>${title}</h3>${S[k].map((x,i)=>`<span class="chip">${esc(x)}<button class="s" onclick="rmL('${k}',${i})">×</button></span>`).join('')}
<div class="bar" style="margin:8px 0 0"><div><input id="l_${k}" placeholder="Tambah baru"></div><button onclick="addL('${k}')">Tambah</button></div></div>`}
function addL(k){const v=$('#l_'+k).value.trim();if(v&&!S[k].includes(v)){S[k].push(v);sv('s',S);render()}}
function rmL(k,i){S[k].splice(i,1);sv('s',S);render()}
function set(){return `<div class="card"><h3>Tarif &amp; Komisi</h3>${V.map((v,i)=>`<div class="row"><div><label>${v} – Tarif (Rp)</label><input id="r${i}" type="number" value="${S.price[v].rate}"></div><div><label>${v} – Komisi (%)</label><input id="c${i}" type="number" value="${S.price[v].com*100}"></div></div>`).join('')}<button onclick="saveP()">Simpan Tarif</button></div>
${list('ops','Manajemen Operator')}${list('pay','Jenis Transaksi / Pembayaran')}${list('cats','Kategori Pengeluaran')}
<div class="card"><h3>Info Struk</h3><div class="row"><div><label>Nama Usaha</label><input id="sb" value="${esc(S.biz)}"></div><div><label>Alamat / Telp</label><input id="sa" value="${esc(S.addr)}"></div><div><label>Pesan Penutup</label><input id="sf" value="${esc(S.footer)}"></div></div><button onclick="saveI()">Simpan Info Struk</button></div>`}
function saveP(){V.forEach((v,i)=>{S.price[v]={rate:+$('#r'+i).value||0,com:(+$('#c'+i).value||0)/100}});sv('s',S);toast('Tarif disimpan')}
function saveI(){S.biz=$('#sb').value;S.addr=$('#sa').value;S.footer=$('#sf').value;sv('s',S);toast('Info struk disimpan')}
render();
</script></body></html>
